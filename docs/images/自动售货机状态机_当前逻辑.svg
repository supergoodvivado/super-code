<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1500" viewBox="0 0 2000 1500">
  <defs>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#168a58"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#e57924"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d43b3b"/>
    </marker>
    <style>
      .title { font: 700 42px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102a56; }
      .subtitle { font: 22px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #53657d; }
      .state-id { font: 700 21px Consolas, monospace; fill: #153e75; text-anchor: middle; }
      .state-cn { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102a56; text-anchor: middle; }
      .edge { fill: none; stroke: #168a58; stroke-width: 4; marker-end: url(#arrow-green); }
      .back-edge { fill: none; stroke: #e57924; stroke-width: 4; marker-end: url(#arrow-orange); }
      .reset-edge { fill: none; stroke: #d43b3b; stroke-width: 4; marker-end: url(#arrow-red); }
      .edge-label { font: 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24364b; text-anchor: middle; }
      .card-title { font: 700 23px Consolas, monospace; fill: #153e75; }
      .card-line { font: 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #26384d; }
      .legend { font: 20px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #26384d; }
    </style>
  </defs>

  <rect width="2000" height="1500" fill="#f8fafc"/>
  <rect x="20" y="20" width="1960" height="1460" rx="28" fill="#ffffff" stroke="#d9e2ec" stroke-width="2"/>

  <text x="1000" y="72" class="title" text-anchor="middle">FPGA 自动售货机状态机（按当前 RTL 逻辑）</text>
  <text x="1000" y="110" class="subtitle" text-anchor="middle">核心文件：src/vending_machine_core.v　状态编码：ST_IDLE ～ ST_CHANGE</text>

  <!-- Global reset -->
  <path d="M1880 145 L1880 190 L115 190 L115 238" class="reset-edge"/>
  <text x="1525" y="178" class="edge-label" fill="#d43b3b">复位或非法状态 → ST_IDLE，并清空交易</text>

  <!-- State nodes -->
  <g>
    <rect x="35" y="245" width="215" height="112" rx="18" fill="#eaf2ff" stroke="#2457a7" stroke-width="4"/>
    <text x="142.5" y="292" class="state-id">ST_IDLE</text>
    <text x="142.5" y="329" class="state-cn">待机</text>

    <rect x="310" y="245" width="215" height="112" rx="18" fill="#eaf2ff" stroke="#2457a7" stroke-width="4"/>
    <text x="417.5" y="288" class="state-id">ST_SELECT_PRODUCT</text>
    <text x="417.5" y="329" class="state-cn">商品选择</text>

    <rect x="585" y="245" width="215" height="112" rx="18" fill="#eaf2ff" stroke="#2457a7" stroke-width="4"/>
    <text x="692.5" y="288" class="state-id">ST_SELECT_QTY</text>
    <text x="692.5" y="329" class="state-cn">数量选择</text>

    <rect x="860" y="245" width="215" height="112" rx="18" fill="#eaf2ff" stroke="#2457a7" stroke-width="4"/>
    <text x="967.5" y="288" class="state-id">ST_ORDER_READY</text>
    <text x="967.5" y="329" class="state-cn">订单就绪</text>

    <rect x="1135" y="245" width="215" height="112" rx="18" fill="#eaf2ff" stroke="#2457a7" stroke-width="4"/>
    <text x="1242.5" y="292" class="state-id">ST_PAY</text>
    <text x="1242.5" y="329" class="state-cn">付款</text>

    <rect x="1410" y="245" width="215" height="112" rx="18" fill="#eaf2ff" stroke="#2457a7" stroke-width="4"/>
    <text x="1517.5" y="292" class="state-id">ST_VEND</text>
    <text x="1517.5" y="329" class="state-cn">出货</text>

    <rect x="1685" y="245" width="215" height="112" rx="18" fill="#eaf2ff" stroke="#2457a7" stroke-width="4"/>
    <text x="1792.5" y="292" class="state-id">ST_CHANGE</text>
    <text x="1792.5" y="329" class="state-cn">找零／退款</text>
  </g>

  <!-- Main flow -->
  <path d="M250 301 L300 301" class="edge"/>
  <text x="275" y="225" class="edge-label"><tspan x="275">KEY1</tspan><tspan x="275" dy="24">开始选择</tspan></text>

  <path d="M525 301 L575 301" class="edge"/>
  <text x="550" y="382" class="edge-label"><tspan x="550">KEY1</tspan><tspan x="550" dy="24">锁定商品</tspan></text>

  <path d="M800 301 L850 301" class="edge"/>
  <text x="825" y="225" class="edge-label"><tspan x="825">KEY1</tspan><tspan x="825" dy="24">提交商品和数量</tspan></text>

  <path d="M1075 301 L1125 301" class="edge"/>
  <text x="1100" y="382" class="edge-label"><tspan x="1100">KEY2</tspan><tspan x="1100" dy="24">确认付款</tspan></text>

  <path d="M1350 301 L1400 301" class="edge"/>
  <text x="1375" y="225" class="edge-label"><tspan x="1375">投币后金额</tspan><tspan x="1375" dy="24">≥ total_due</tspan></text>

  <path d="M1625 301 L1675 301" class="edge"/>
  <text x="1650" y="382" class="edge-label"><tspan x="1650">计时结束且</tspan><tspan x="1650" dy="24">change_due &gt; 0</tspan></text>

  <!-- Completion paths -->
  <path d="M1518 357 L1518 465 L143 465 L143 367" class="edge"/>
  <text x="720" y="454" class="edge-label">计时结束且 change_due = 0</text>
  <path d="M1793 357 L1793 510 L105 510 L105 367" class="edge"/>
  <text x="1145" y="500" class="edge-label">找零／退款完成（change_due = 0 或最后一元退完）</text>

  <!-- Exact transition cards -->
  <text x="70" y="585" class="title" font-size="30">补充分支与状态内行为</text>
  <text x="1930" y="585" class="subtitle" text-anchor="end">箭头图展示主流程；以下列出所有条件分支</text>

  <!-- Row 1 cards -->
  <g>
    <rect x="55" y="620" width="600" height="310" rx="18" fill="#fff8ef" stroke="#e9a15b" stroke-width="3"/>
    <text x="85" y="662" class="card-title">ST_SELECT_PRODUCT</text>
    <text x="85" y="704" class="card-line">• KEY3，selected_count = 1 → ST_ORDER_READY（恢复第 1 件）</text>
    <text x="85" y="744" class="card-line">• KEY3，selected_count = 0：同 KEY4 退款／待机</text>
    <text x="85" y="784" class="card-line">• KEY4：有余额 → ST_CHANGE（退款）</text>
    <text x="85" y="824" class="card-line">• KEY4：无余额 → ST_IDLE</text>
    <text x="85" y="864" class="card-line">• 事件优先级：KEY4 → KEY3 → KEY1 → KEY2</text>
    <text x="85" y="904" class="card-line">• KEY2 且 total_due &gt; 0 → ST_PAY</text>

    <rect x="700" y="620" width="600" height="310" rx="18" fill="#fff8ef" stroke="#e9a15b" stroke-width="3"/>
    <text x="730" y="662" class="card-title">ST_SELECT_QTY</text>
    <text x="730" y="704" class="card-line">• KEY3 → ST_SELECT_PRODUCT（重新选择商品）</text>
    <text x="730" y="744" class="card-line">• 当前商品尚未提交，订单保持不变</text>
    <text x="730" y="784" class="card-line">• KEY4：有余额 → ST_CHANGE；无余额 → ST_IDLE</text>
    <text x="730" y="824" class="card-line">• KEY1 → 提交当前商品和数量</text>
    <text x="730" y="864" class="card-line">• 事件优先级：KEY4 → KEY3 → KEY1</text>
    <text x="730" y="904" class="card-line">• 商品保持 pending_code，数量由 sw[1:0] 决定</text>

    <rect x="1345" y="620" width="600" height="310" rx="18" fill="#fff8ef" stroke="#e9a15b" stroke-width="3"/>
    <text x="1375" y="662" class="card-title">ST_ORDER_READY</text>
    <text x="1375" y="704" class="card-line">• KEY1 → ST_SELECT_PRODUCT（继续选购）</text>
    <text x="1375" y="744" class="card-line">• KEY2 且 total_due &gt; 0 → ST_PAY</text>
    <text x="1375" y="784" class="card-line">• KEY3 → ST_SELECT_QTY（恢复最后一件商品数量）</text>
    <text x="1375" y="824" class="card-line">• KEY4：有余额 → ST_CHANGE；无余额 → ST_IDLE</text>
    <text x="1375" y="864" class="card-line">• 事件优先级：KEY4 → KEY3 → KEY1 → KEY2</text>
    <text x="1375" y="864" class="card-line">• paid_amount、change_due 保持为 0</text>
  </g>

  <!-- Row 2 cards -->
  <g>
    <rect x="55" y="970" width="760" height="330" rx="18" fill="#eef8ff" stroke="#5b9bd5" stroke-width="3"/>
    <text x="85" y="1012" class="card-title">ST_PAY</text>
    <text x="85" y="1054" class="card-line">• KEY1：投 1 元；KEY2：按 sw[1:0] 投 5／10／20／50 元</text>
    <text x="85" y="1094" class="card-line">• 投币后仍不足 → 留在 ST_PAY，更新 paid_amount</text>
    <text x="85" y="1134" class="card-line">• 投币后足额 → ST_VEND，change_due = 投入后金额 − total_due</text>
    <text x="85" y="1174" class="card-line">• KEY3 且 paid_amount &gt; 0 → 退 1 元，留在 ST_PAY</text>
    <text x="85" y="1214" class="card-line">• KEY4 且 paid_amount &gt; 0 → ST_CHANGE（取消退款）</text>
    <text x="85" y="1254" class="card-line">• KEY4 且 paid_amount = 0 → ST_IDLE；优先级：KEY4 → KEY3 → KEY1 → KEY2</text>

    <rect x="850" y="970" width="520" height="330" rx="18" fill="#eef8ff" stroke="#5b9bd5" stroke-width="3"/>
    <text x="880" y="1012" class="card-title">ST_VEND</text>
    <text x="880" y="1054" class="card-line">• vend_counter &gt; 0：每周期减 1</text>
    <text x="880" y="1094" class="card-line">• 计时结束，change_due &gt; 0</text>
    <text x="910" y="1134" class="card-line">→ ST_CHANGE</text>
    <text x="880" y="1174" class="card-line">• 计时结束，change_due = 0</text>
    <text x="910" y="1214" class="card-line">→ 清空交易并进入 ST_IDLE</text>
    <text x="880" y="1254" class="card-line">• 本状态不处理普通按键</text>

    <rect x="1405" y="970" width="540" height="330" rx="18" fill="#eef8ff" stroke="#5b9bd5" stroke-width="3"/>
    <text x="1435" y="1012" class="card-title">ST_CHANGE</text>
    <text x="1435" y="1054" class="card-line">• change_due = 0</text>
    <text x="1465" y="1094" class="card-line">→ 清空交易并进入 ST_IDLE</text>
    <text x="1435" y="1134" class="card-line">• KEY1 → ST_SELECT_PRODUCT（保留余额）</text>
    <text x="1435" y="1174" class="card-line">• KEY3：余额减 1；余额为 0 时 → ST_IDLE</text>
    <text x="1435" y="1214" class="card-line">• 退最后一元 → ST_IDLE</text>
  </g>

  <!-- Legend -->
  <rect x="55" y="1340" width="1890" height="100" rx="16" fill="#f5f7fa" stroke="#c7d1dd" stroke-width="2"/>
  <line x1="90" y1="1384" x2="160" y2="1384" stroke="#168a58" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="178" y="1391" class="legend">正常流程</text>
  <line x1="330" y1="1384" x2="400" y2="1384" stroke="#e57924" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <text x="418" y="1391" class="legend">返回／取消</text>
  <line x1="590" y1="1384" x2="660" y2="1384" stroke="#d43b3b" stroke-width="5" marker-end="url(#arrow-red)"/>
  <text x="678" y="1391" class="legend">复位／异常恢复</text>
  <text x="930" y="1391" class="legend">KEY1 选择／投 1 元　 KEY2 确认／投纸币　 KEY3 返回／退 1 元　 KEY4 清空／取消</text>
</svg>
